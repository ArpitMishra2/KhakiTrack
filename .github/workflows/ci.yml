name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository; it writes nothing back.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Sign with the shared debug key so the APK's SHA-1 matches the Android
      # OAuth client. Without the secret (e.g. forks) a random key is used and
      # Google sign-in will not work on that APK.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep SHA1
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; Google sign-in will not work on this APK."
          fi
      - run: flutter build apk --debug
      # Small phone build (arm64 only, about 20 MB) for installing on test
      # phones over mobile data. Signed with the same shared debug key.
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maidan-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maidan-phone-arm64-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check and test every edge function
        working-directory: supabase/functions
        run: |
          for f in */; do
            f=${f%/}
            [ -f "$f/deno.json" ] || continue
            echo "== $f"
            (cd "$f" && deno check --config deno.json index.ts && deno test --config deno.json --allow-env --allow-read .)
          done
