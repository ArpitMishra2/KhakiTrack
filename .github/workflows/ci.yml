name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Sign with the shared debug key so the APK's SHA-1 matches the Android
      # OAuth client. Without the secret (e.g. forks) a random key is used and
      # Google sign-in will not work on that APK.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep SHA1
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; Google sign-in will not work on this APK."
          fi
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: maidan-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check and test every edge function
        working-directory: supabase/functions
        run: |
          for f in */; do
            f=${f%/}
            [ -f "$f/deno.json" ] || continue
            echo "== $f"
            (cd "$f" && deno check --config deno.json index.ts && deno test --config deno.json --allow-env --allow-read .)
          done
